<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Специальное предложение</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #fce4ec; margin: 0; }
        .container { max-width: 400px; margin: 40px auto; padding: 20px; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #c2185b; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container" id="boxContent" style="display: none;">
        <h1>Получи свой бонус!</h1>
        <p>Введи свои данные и получи доступ.</p>
        <form id="leadForm">
            <input type="text" id="name" placeholder="Ваше имя" required>
            <input type="tel" id="phone" placeholder="Ваш телефон" required>
            <button type="submit" id="submitBtn">ПОЛУЧИТЬ</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const geo = urlParams.get('geo') || 'unknown';
        const isBack = urlParams.get('back') === '1';

        if (isBack) {
            // Вернулись с Лендинга. Показываем форму Бокса.
            document.getElementById('boxContent').style.display = 'block';
            
            history.pushState(null, null, location.href);
            window.onpopstate = function () {
                window.location.href = `https://azosteam.github.io/cpa-land/main.html?geo=${geo}&back=1`;
            };

            document.getElementById('leadForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                btn.innerText = 'Отправка...';
                btn.disabled = true;
                const name = document.getElementById('name').value;
                const phone = document.getElementById('phone').value;
                try {
                    const response = await fetch('https://cpa-funnel-api.033-azosteam.workers.dev/api/lead', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, phone, geo })
                    });
                    const result = await response.json();
                    if (result.success) window.location.href = 'https://google.com';
                    else alert('Ошибка.');
                } catch (error) {
                    alert('Ошибка сети.');
                }
            });
        } else {
            // Первый заход. Моментально летим на Лендинг.
            window.location.replace(`https://azosteam.github.io/cpa-land/landing.html?geo=${geo}`);
        }
    </script>
</body>
</html>
