<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заработай сейчас</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #ffffff; display: block; }
        .container { max-width: 400px; margin: 40px auto; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 10px; background: #fff; }
        h1 { color: #333; font-size: 24px; }
        p { color: #666; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #ff5722; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #e64a19; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <h1>Получи свой бонус!</h1>
        <p>Введи свои данные и получи доступ.</p>
        
        <form id="leadForm">
            <input type="text" id="name" placeholder="Ваше имя" required>
            <input type="tel" id="phone" placeholder="Ваш телефон" required>
            <button type="submit" id="submitBtn">ПОЛУЧИТЬ</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const geo = urlParams.get('geo') || 'unknown';
        const offerId = urlParams.get('offer_id') || 'test_offer1';
        
        console.log("Лендинг загружен. Гео:", geo, "Оффер:", offerId);

        // Ловушка кнопки "Назад"
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            window.location.href = `https://azosteam.github.io/cpa-land/box.html?geo=${geo}&back=1&offer_id=${offerId}`;
        };

        // Отправка формы
        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Отправка...';
            btn.disabled = true;

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            console.log("Отправляем данные:", { name, phone, geo, offer_id: offerId });

            try {
                const response = await fetch('https://cpa-funnel-api.033-azosteam.workers.dev/api/lead', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, geo, offer_id: offerId })
                });
                
                console.log("Ответ сервера (статус):", response.status);

                if (response.status === 403) {
                    alert('К сожалению, лимит заявок по этому предложению исчерпан.');
                    btn.innerText = 'ПОЛУЧИТЬ';
                    btn.disabled = false;
                    return;
                }

                const result = await response.json();
                console.log("Данные от сервера:", result);
                
                if (result.success) {
                    // Успех! Показываем сообщение прямо на странице
                    document.getElementById('mainContainer').innerHTML = `
                        <h1 style="color: #28a745;">Успешно!</h1>
                        <p>Ваша заявка принята. Менеджер свяжется с вами в ближайшее время.</p>
                    `;
                } else {
                    alert('Ошибка сервера: ' + (result.error || 'Неизвестная ошибка'));
                    btn.innerText = 'ПОЛУЧИТЬ';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Ошибка Fetch:", error);
                alert('Ошибка сети. Проверьте интернет.');
                btn.innerText = 'ПОЛУЧИТЬ';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
