<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заработай сейчас</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background: #ffffff; 
            display: block; 
        }
        .container { 
            max-width: 400px; 
            margin: 40px auto; 
            padding: 20px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            border-radius: 10px; 
            background: #fff;
        }
        h1 { color: #333; font-size: 24px; }
        p { color: #666; margin-bottom: 20px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background: #ff5722; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        button:hover { background: #e64a19; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Получи свой бонус!</h1>
        <p>Введи свои данные и получи доступ.</p>
        
        <form id="leadForm">
            <input type="text" id="name" placeholder="Ваше имя" required>
            <input type="tel" id="phone" placeholder="Ваш телефон" required>
            <button type="submit" id="submitBtn">ПОЛУЧИТЬ</button>
        </form>
    </div>

    <script>
        // Получаем гео и ID оффера из URL (переданного с Проклы через Главную и Бокс)
        const urlParams = new URLSearchParams(window.location.search);
        const geo = urlParams.get('geo') || 'unknown';
        const offerId = urlParams.get('offer_id') || 'default_offer'; // <-- Добавили получение оффера

        // --- ЛОВУШКА КНОПКИ "НАЗАД" ---
        // При нажатии "Назад" на Лендинге летим на Бокс (передаем geo, back=1 и offer_id)
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            window.location.href = `https://azosteam.github.io/cpa-land/box.html?geo=${geo}&back=1&offer_id=${offerId}`;
        };

        // --- ОТПРАВКА ФОРМЫ ---
        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Отправка...';
            btn.disabled = true;

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            try {
                const response = await fetch('https://cpa-funnel-api.033-azosteam.workers.dev/api/lead', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // Добавили offer_id в тело запроса
                    body: JSON.stringify({ name, phone, geo, offer_id: offerId })
                });
                
                // Если сервер вернул 403, значит капа закончилась или сделка на стопе
                if (response.status === 403) {
                    alert('К сожалению, лимит заявок по этому предложению исчерпан.');
                    // Здесь можно сделать редирект на домонетизацию, например:
                    // window.location.href = 'https://azosteam.github.io/cpa-land/main.html';
                    return;
                }

                const result = await response.json();
                
                if (result.success) {
                    window.location.href = 'https://google.com'; // Страница Спасибо
                } else {
                    alert('Ошибка при отправке. Попробуйте еще раз.');
                    btn.innerText = 'ПОЛУЧИТЬ';
                    btn.disabled = false;
                }
            } catch (error) {
                alert('Ошибка сети. Проверьте интернет.');
                btn.innerText = 'ПОЛУЧИТЬ';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
