<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body { margin: 0; background-color: #222; display: none; }
    </style>
</head>
<body>
    <h1>Hello World</h1>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const geo = urlParams.get('geo') || 'unknown';
        const isBack = urlParams.get('back') === '1';

        if (isBack) {
            // Если пользователь вернулся (нажал Назад), показываем Hello World и держим его
            document.body.style.display = 'block';
            history.pushState(null, null, location.href);
            window.onpopstate = function () {
                history.pushState(null, null, location.href);
            };
        } else {
            // Если зашли впервые, моментально летим на Бокс
            window.location.replace(`https://azosteam.github.io/cpa-land/box.html?geo=${geo}`);
        }
    </script>
</body>
</html>
